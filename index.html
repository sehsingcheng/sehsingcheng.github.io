<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>鄭色幸 | Dr. Cheng | Se-Hsing Cheng</title>

  <meta name="description"
    content="Academic website of Se-Hsing Cheng 鄭色幸. Chinese Language Education, Language Assessment, AI-enhanced Language Education, Local Narrative, and Gender Equity.">

  <style>

    /* ==============================
       COLOR SYSTEM
    ============================== */

    :root {
      --navy: #092f55;
      --deep-blue: #0c416f;
      --blue: #17659b;
      --light-blue: #eaf3f8;

      --gold: #c69a3b;
      --light-gold: #e7d3a1;

      --cream: #fbfaf6;
      --white: #ffffff;

      --text: #24313d;
      --muted: #65727d;
      --border: #dde4e8;

      --shadow: 0 12px 35px rgba(9, 47, 85, 0.08);
    }


    /* ==============================
       BASIC
    ============================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--white);
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1160px, 90%);
      margin: auto;
    }

    section {
      padding: 90px 0;
    }


    /* ==============================
       NAVIGATION
    ============================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);

      border-bottom: 1px solid rgba(198, 154, 59, 0.3);
    }

    .nav {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }


    /* ==============================
       TEXT LOGO
    ============================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-cn {
      writing-mode: vertical-rl;

      color: var(--navy);
      font-family: "Noto Serif TC", "PMingLiU", serif;

      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;

      border-right: 2px solid var(--gold);
      padding-right: 9px;
    }

    .brand-en {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;

      color: var(--navy);
      line-height: 1;
    }

    .brand-en span {
      color: var(--gold);
      font-style: italic;
    }

    .menu {
      display: flex;
      gap: 28px;

      font-size: 14px;
      font-weight: 600;

      color: var(--navy);
    }

    .menu a {
      transition: 0.25s;
    }

    .menu a:hover {
      color: var(--gold);
    }


    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 720px;

      display: flex;
      align-items: center;

      background:
        radial-gradient(circle at 82% 20%,
          rgba(198,154,59,0.12),
          transparent 28%),
        linear-gradient(
          130deg,
          #ffffff 0%,
          #f5f9fc 55%,
          #edf4f8 100%
        );

      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";

      position: absolute;
      width: 480px;
      height: 480px;

      border: 2px solid rgba(198,154,59,0.18);
      border-radius: 50%;

      right: -140px;
      top: -120px;
    }

    .hero-grid {
      display: grid;

      grid-template-columns: 1.25fr 0.75fr;

      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      color: var(--gold);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 10px;

      font-family: Georgia, "Noto Serif TC", serif;

      font-size: clamp(50px, 7vw, 82px);
      line-height: 1.05;

      color: var(--navy);
    }

    .hero h1 .gold {
      color: var(--gold);
    }

    .name-cn {
      margin: 15px 0 5px;

      font-family: "Noto Serif TC", "PMingLiU", serif;

      font-size: 29px;
      font-weight: 700;

      letter-spacing: 8px;
      color: var(--navy);
    }

    .name-en {
      font-family: Georgia, serif;

      font-size: 18px;
      letter-spacing: 4px;

      color: var(--muted);
    }

    .hero-description {
      max-width: 720px;

      margin-top: 32px;

      font-size: 18px;
      color: #425260;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;
      margin-top: 28px;
    }

    .keyword {
      padding: 7px 14px;

      border: 1px solid var(--light-gold);
      border-radius: 99px;

      color: var(--navy);
      background: rgba(255,255,255,0.75);

      font-size: 13px;
    }

    .hero-buttons {
      margin-top: 35px;

      display: flex;
      flex-wrap: wrap;

      gap: 15px;
    }

    .button {
      display: inline-block;

      padding: 12px 23px;
      border-radius: 3px;

      font-size: 14px;
      font-weight: 600;

      transition: 0.25s;
    }

    .button-primary {
      background: var(--navy);
      color: white;

      border: 1px solid var(--navy);
    }

    .button-primary:hover {
      background: var(--deep-blue);
    }

    .button-secondary {
      border: 1px solid var(--gold);

      color: var(--navy);
      background: white;
    }

    .button-secondary:hover {
      background: var(--cream);
    }


    /* ==============================
       HERO SIGNATURE PANEL
    ============================== */

    .signature-panel {
      position: relative;

      min-height: 400px;

      border-left: 1px solid var(--light-gold);

      padding-left: 50px;

      display: flex;
      align-items: center;
    }

    .signature-inner {
      text-align: center;
      width: 100%;
    }

    .vertical-name {
      display: inline-block;

      writing-mode: vertical-rl;

      font-family: "Noto Serif TC", "PMingLiU", serif;

      color: var(--navy);

      font-size: 50px;
      font-weight: 700;

      letter-spacing: 12px;

      border: 2px solid var(--gold);

      padding: 26px 13px 16px;
    }

    .signature {
      margin-top: 28px;

      font-family: Georgia, serif;
      font-style: italic;

      color: var(--gold);

      font-size: 25px;
    }


    /* ==============================
       SECTION TITLES
    ============================== */

    .section-label {
      color: var(--gold);

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 8px;
    }

    .section-title {
      margin: 0;

      font-family: Georgia, "Noto Serif TC", serif;

      color: var(--navy);

      font-size: clamp(34px, 5vw, 48px);

      line-height: 1.25;
    }

    .section-intro {
      max-width: 760px;

      margin-top: 18px;

      color: var(--muted);
      font-size: 16px;
    }


    /* ==============================
       FIVE EXPERTISE AREAS
    ============================== */

    .expertise {
      background: var(--cream);
    }

    .expertise-grid {
      display: grid;

      grid-template-columns: repeat(5, 1fr);

      gap: 18px;

      margin-top: 55px;
    }

    .expertise-card {
      background: white;

      border-top: 4px solid var(--gold);

      padding: 28px 22px 30px;

      min-height: 300px;

      box-shadow: var(--shadow);

      transition: 0.25s;
    }

    .expertise-card:hover {
      transform: translateY(-6px);
    }

    .number {
      font-family: Georgia, serif;

      color: var(--gold);

      font-size: 14px;

      margin-bottom: 30px;
    }

    .expertise-card h3 {
      margin: 0 0 5px;

      font-family: "Noto Serif TC", serif;

      color: var(--navy);

      font-size: 20px;
    }

    .expertise-card h4 {
      margin: 0 0 18px;

      color: var(--gold);

      font-family: Georgia, serif;

      font-size: 14px;
      line-height: 1.45;

      font-weight: 500;
    }

    .expertise-card p {
      margin: 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.75;
    }


    /* ==============================
       ABOUT
    ============================== */

    .about-grid {
      display: grid;

      grid-template-columns: 0.8fr 1.2fr;

      gap: 80px;

      margin-top: 50px;
      align-items: start;
    }

    .about-highlight {
      background: var(--navy);

      color: white;

      padding: 42px;
    }

    .about-highlight .big {
      font-family: Georgia, serif;

      font-size: 62px;

      color: var(--gold);

      line-height: 1;
    }

    .about-highlight p {
      color: #dce8f0;
    }

    .about-text p {
      margin-top: 0;
      margin-bottom: 20px;
    }


    /* ==============================
       PROFESSIONAL HISTORY
    ============================== */

    .timeline {
      margin-top: 50px;

      border-left: 2px solid var(--light-gold);

      padding-left: 35px;
    }

    .timeline-item {
      position: relative;

      margin-bottom: 40px;
    }

    .timeline-item::before {
      content: "";

      position: absolute;

      left: -42px;
      top: 8px;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: var(--gold);
      border: 3px solid white;

      box-shadow: 0 0 0 1px var(--gold);
    }

    .timeline-year {
      color: var(--gold);
      font-weight: 700;
      font-size: 13px;
    }

    .timeline-item h3 {
      color: var(--navy);

      margin: 5px 0 5px;

      font-size: 19px;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
    }


    /* ==============================
       PROJECTS
    ============================== */

    .projects {
      background: var(--navy);
      color: white;
    }

    .projects .section-title {
      color: white;
    }

    .projects .section-intro {
      color: #c7d6e3;
    }

    .projects-grid {
      margin-top: 50px;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 22px;
    }

    .project-card {
      padding: 35px;

      border: 1px solid rgba(231,211,161,0.35);

      background: rgba(255,255,255,0.04);
    }

    .project-card .tag {
      color: var(--gold);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    .project-card h3 {
      margin: 12px 0;

      font-family: "Noto Serif TC", serif;

      font-size: 23px;
    }

    .project-card p {
      color: #cbd8e2;
      font-size: 14px;
    }


    /* ==============================
       GENDER EQUITY
    ============================== */

    .gender-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 60px;

      margin-top: 50px;
    }

    .service-box {
      border: 1px solid var(--border);

      padding: 34px;

      border-top: 4px solid var(--gold);
    }

    .service-box h3 {
      color: var(--navy);

      margin-top: 0;
    }

    .service-box ul {
      padding-left: 22px;
    }

    .service-box li {
      margin-bottom: 10px;
    }


    /* ==============================
       CONTACT
    ============================== */

    .contact {
      background: var(--cream);
      text-align: center;
    }

    .contact-title {
      font-family: Georgia, "Noto Serif TC", serif;

      color: var(--navy);

      font-size: 43px;

      margin-bottom: 10px;
    }

    .contact-sub {
      color: var(--muted);

      max-width: 650px;

      margin: auto;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: #071f36;

      color: #aac0d1;

      text-align: center;

      padding: 25px;

      font-size: 13px;

      border-top: 2px solid var(--gold);
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 1000px) {

      .expertise-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .projects-grid {
        grid-template-columns: 1fr 1fr;
      }

      .hero-grid,
      .about-grid,
      .gender-grid {
        grid-template-columns: 1fr;
      }

      .signature-panel {
        display: none;
      }

    }

    @media (max-width: 720px) {

      section {
        padding: 65px 0;
      }

      .menu {
        display: none;
      }

      .brand-en {
        font-size: 23px;
      }

      .hero {
        min-height: 650px;
      }

      .hero h1 {
        font-size: 55px;
      }

      .expertise-grid,
      .projects-grid {
        grid-template-columns: 1fr;
      }

    }

/* =========================================
   HERO RIGHT — DR. CHENG VISUAL SYSTEM
========================================= */

.hero-visual{
  position:relative;

  width:100%;
  min-height:570px;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  overflow:visible;
}


/* -----------------------------------------
   PHOTO BLEND
----------------------------------------- */

.photo-blend{
  position:absolute;

  z-index:6;

  right:6%;
  bottom:40px;

  width:390px;
  height:500px;

  overflow:hidden;

  border-radius:
    48% 48% 18% 18%
    / 24% 24% 10% 10%;

  filter:
    drop-shadow(
      0 24px 32px rgba(7,47,86,.10)
    );

  /*
  讓照片四周漸漸融入 Hero 底色
  */
  -webkit-mask-image:
    radial-gradient(
      ellipse at 58% 50%,
      #000 0%,
      #000 66%,
      rgba(0,0,0,.88) 76%,
      rgba(0,0,0,.42) 89%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse at 58% 50%,
      #000 0%,
      #000 66%,
      rgba(0,0,0,.88) 76%,
      rgba(0,0,0,.42) 89%,
      transparent 100%
    );
}

.hero-profile-photo{
  width:100%;
  height:100%;

  object-fit:cover;
  object-position:63% center;

  display:block;
}


/* -----------------------------------------
   GOLD RINGS
----------------------------------------- */

.hero-gold-ring{
  position:absolute;

  z-index:1;

  border-radius:50%;

  pointer-events:none;
}

.ring-one{
  width:510px;
  height:510px;

  right:-50px;
  top:-25px;

  border:
    1.5px solid rgba(199,154,66,.24);
}

.ring-two{
  width:390px;
  height:470px;

  right:72px;
  top:50px;

  border:
    1px solid rgba(199,154,66,.11);

  transform:rotate(-13deg);
}


/* -----------------------------------------
   FEATHER
----------------------------------------- */

.hero-feather{
  position:absolute;

  z-index:7;

  right:8%;
  top:12px;

  width:95px;
  height:245px;

  transform:rotate(18deg);
}

.feather-blade{
  position:absolute;

  left:15px;
  top:0;

  width:68px;
  height:175px;

  background:
    linear-gradient(
      145deg,
      #07345f 0%,
      #145b91 58%,
      #092e55 79%,
      #c79a42 100%
    );

  clip-path:
    polygon(
      50% 0%,
      90% 10%,
      100% 31%,
      91% 60%,
      65% 88%,
      45% 100%,
      30% 80%,
      8% 56%,
      0% 30%,
      17% 10%
    );
}

.feather-blade::after{
  content:"";

  position:absolute;

  left:33px;
  top:4px;

  width:2px;
  height:168px;

  background:#d0a447;

  transform:rotate(5deg);
}

.feather-stem{
  position:absolute;

  left:49px;
  top:158px;

  width:5px;
  height:95px;

  background:
    linear-gradient(
      #d3a94c,
      #a8741e
    );

  border-radius:5px;
}


/* -----------------------------------------
   AI NETWORK
----------------------------------------- */

.ai-network{
  position:absolute;

  z-index:2;

  width:135px;
  height:110px;

  right:2%;
  top:150px;

  opacity:.36;
}


/* -----------------------------------------
   LOCAL LANDSCAPE
----------------------------------------- */

.local-landscape{
  position:absolute;

  z-index:1;

  width:330px;
  height:180px;

  right:-20px;
  bottom:105px;

  opacity:.16;
}

.mountain{
  position:absolute;

  left:0;
  right:0;

  bottom:25px;

  height:125px;

  background:
    linear-gradient(
      180deg,
      rgba(96,151,188,.15),
      rgba(61,123,165,.55)
    );
}

.m1{
  clip-path:
    polygon(
      0 100%,
      15% 63%,
      29% 78%,
      44% 44%,
      57% 73%,
      73% 41%,
      88% 70%,
      100% 100%
    );
}

.m2{
  opacity:.45;

  transform:
    translateY(24px)
    scale(.82);

  clip-path:
    polygon(
      0 100%,
      22% 64%,
      39% 79%,
      54% 50%,
      69% 73%,
      84% 49%,
      100% 100%
    );
}

.pavilion{
  position:absolute;

  right:35px;
  top:64px;

  font-family:
    "Noto Serif TC",
    serif;

  font-size:35px;

  color:#0b4778;
}

.river-line{
  position:absolute;

  right:30px;
  bottom:3px;

  width:205px;
  height:73px;

  border-left:
    12px solid rgba(65,127,167,.30);

  border-radius:60%;

  transform:rotate(-12deg);
}


/* -----------------------------------------
   GINKGO
----------------------------------------- */

.ginkgo-art{
  position:absolute;

  z-index:8;

  right:33%;
  bottom:68px;

  width:130px;
  height:165px;
}

.ginkgo-stem{
  position:absolute;

  left:63px;
  bottom:0;

  width:3px;
  height:105px;

  background:#c79a42;
}

.ginkgo-leaf{
  position:absolute;

  display:block;

  border-radius:
    80% 15%
    75% 25%;
}

.leaf-a{
  width:65px;
  height:58px;

  left:9px;
  top:28px;

  background:
    linear-gradient(
      135deg,
      #0a3968,
      #175d91,
      #c79a42
    );

  transform:rotate(-26deg);
}

.leaf-b{
  width:68px;
  height:58px;

  right:0;
  top:60px;

  background:
    linear-gradient(
      135deg,
      #0e4d7f,
      #083761,
      #c39b50
    );

  transform:rotate(27deg);
}

.leaf-c{
  width:45px;
  height:40px;

  left:0;
  top:90px;

  background:
    linear-gradient(
      135deg,
      #e2bd69,
      #c79a42
    );

  transform:rotate(-38deg);
}


/* -----------------------------------------
   OPEN BOOK
----------------------------------------- */

.open-book{
  position:absolute;

  z-index:9;

  right:2%;
  bottom:12px;

  width:235px;
  height:110px;
}

.book-page{
  position:absolute;

  bottom:0;

  width:52%;
  height:82px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.96),
      rgba(229,240,247,.88)
    );

  border:
    1.5px solid rgba(31,91,134,.40);

  box-shadow:
    0 8px 20px
    rgba(5,45,75,.07);
}

.page-left{
  left:0;

  border-radius:
    78% 18%
    6% 20%;

  transform:rotate(-8deg);

  transform-origin:
    bottom right;
}

.page-right{
  right:0;

  border-radius:
    18% 78%
    20% 6%;

  transform:rotate(8deg);

  transform-origin:
    bottom left;
}

.book-spine{
  position:absolute;

  left:50%;
  bottom:0;

  width:3px;
  height:87px;

  background:#c79a42;

  transform:translateX(-50%);
}


/* -----------------------------------------
   BLUE-GOLD WAVES
----------------------------------------- */

.brand-waves{
  position:absolute;

  z-index:5;

  left:-9%;
  right:-12%;
  bottom:-4px;

  height:120px;

  overflow:hidden;

  pointer-events:none;
}

.wave{
  position:absolute;

  display:block;

  left:-3%;

  width:108%;

  border-radius:50%;
}

.blue-wave{
  top:24px;

  height:100px;

  border-top:
    25px solid rgba(10,65,108,.44);

  transform:
    rotate(-2deg)
    skewX(-16deg);
}

.soft-wave{
  top:49px;

  height:80px;

  border-top:
    17px solid rgba(105,155,190,.25);

  transform:
    rotate(2deg)
    skewX(14deg);
}

.gold-wave{
  top:65px;

  height:65px;

  border-top:
    9px solid rgba(199,154,66,.38);

  transform:
    rotate(-1deg)
    skewX(-10deg);
}

.gold-line{
  top:80px;

  height:50px;

  border-top:
    2px solid rgba(199,154,66,.55);

  transform:rotate(1deg);
}


/* -----------------------------------------
   DESKTOP BALANCE
----------------------------------------- */

@media(min-width:1100px){

  .hero-visual{
    transform:translateX(-18px);
  }

}


/* -----------------------------------------
   TABLET
----------------------------------------- */

@media(max-width:980px){

  .hero-visual{
    min-height:530px;
  }

  .photo-blend{
    right:50%;

    transform:translateX(50%);

    width:360px;
    height:465px;
  }

  .hero-feather{
    right:17%;
  }

  .ai-network{
    right:11%;
  }

  .ginkgo-art{
    right:19%;
  }

  .open-book{
    right:13%;
  }

}


/* -----------------------------------------
   MOBILE
----------------------------------------- */

@media(max-width:720px){

  .hero-visual{
    min-height:460px;
  }

  .photo-blend{
    width:300px;
    height:395px;

    bottom:35px;
  }

  .hero-feather{
    transform:
      scale(.72)
      rotate(18deg);

    transform-origin:
      top right;
  }

  .ai-network{
    width:100px;

    opacity:.25;
  }
